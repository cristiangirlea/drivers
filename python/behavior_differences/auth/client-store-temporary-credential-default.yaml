name: "client_store_temporary_credential defaults true"
status: allowed
type: enhancement
reviewed: true
is_breaking_change: false
impact: medium
legacy_id: 97
old_driver_behavior: |
  The connection parameter defaults to false. External-browser login on macOS and
  Windows still sets the CLIENT_STORE_TEMPORARY_CREDENTIAL session parameter to
  true, so an omitted flag still caches the ID token on those platforms. Linux and
  OAuth authorization-code caching follow the connection parameter (off unless set).
new_driver_behavior: |
  The connection parameter defaults to true on every platform and every cacheable
  authenticator. An explicit false disables ID, OAuth, and MFA token caching,
  including on macOS and Windows.
description: |
  Linux callers that omitted the flag now cache tokens. Callers that set
  client_store_temporary_credential=False now disable caching even on macOS/Windows
  external-browser login, where the old driver still forced the session parameter
  on.
