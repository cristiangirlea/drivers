name: "Failed GET download no longer leaves an orphaned .part file"
status: allowed
type: bugfix
reviewed: true
is_breaking_change: false
impact: low
legacy_id: 39
status_rationale: |
  The legacy connector staged downloads in a `<dst>.part` file but never removed it on the
  failure path, so an interrupted GET left an orphaned `.part` behind. The universal driver
  removes the staging file on failure, so a failed download leaves no debris. The improvement
  is accepted.
old_driver_behavior: |
  The legacy connector downloads to an intermediate `<dst>.part` file
  (`SnowflakeStorageClient.intermediate_dst_path`) and renames it to the final path only on
  full success. On a failed or interrupted GET (chunk error, digest/decryption failure, or
  retry exhaustion) `finish_download` takes its failure branch, which only removes a
  pre-existing final file and never unlinks the `.part` (`delete_client_data` cleans only the
  separate `tmp_dir`). An orphaned `<dst>.part` is therefore left behind in the destination
  directory until the user removes it manually. The final destination path itself is not
  corrupted, because the rename to it happens only on success.
new_driver_behavior: |
  GET downloads assemble into a sibling `<dst>.part` staging file and rename it to the final
  destination only after the transfer completes successfully (and, for client-side-encrypted
  files, only after the SHA-256 content digest verifies). The user-visible destination path is
  therefore only ever a complete file. On failure the driver drains any in-flight chunk writes
  and then removes the `.part` staging file, so a failed download leaves the filesystem clean.
  (A client-side-encrypted download stages ciphertext in a separate temporary file that is
  likewise removed on failure and unlinked once decrypted.) The only residue possible is after
  a hard process kill (SIGKILL / power loss), where at most a single `<dst>.part` can remain —
  self-documenting, and overwritten by the next download of the same file rather than
  accumulating. The contract is cloud-generic (S3, Azure, and GCS).
