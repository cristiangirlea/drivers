name: "fetch_pandas_all/fetch_pandas_batches accept JSON result sets"
status: allowed
type: enhancement
reviewed: true
is_breaking_change: true
impact: medium
legacy_id: 92
old_driver_behavior: |
  `fetch_pandas_all()`/`fetch_pandas_batches()` and the `fetch_arrow_*` equivalents
  raise `NotSupportedError` unless the server returned `queryResultFormat: arrow`,
  so they reject `SHOW`, `DESCRIBE`, `SET`, DDL and PUT/GET result sets.
new_driver_behavior: |
  They return a pandas `DataFrame` (or an Arrow table) for every result set; the
  JSON rowset is converted to Arrow, and no result-format check rejects the fetch.
description: |
  The cursor-level counterpart of entry 18, which records the same capability on
  `ResultBatch`.
