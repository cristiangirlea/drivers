name: "Unused, JSON-only, and internal connect kwargs dropped"
status: allowed
type: api_incompatibility
reviewed: true
is_breaking_change: false
impact: low
legacy_id: 98
old_driver_behavior: |
  `dsn`, `session_id` (connect kwarg), `support_negative_year`,
  `json_result_force_utf8_decoding`, `inject_client_pause`,
  `probe_connection`, `debug_arrow_chunk`,
  `log_imported_packages_in_telemetry`, `log_imported_packages`,
  `snowflake_server_dop_cap_for_file_transfer`, and
  `reraise_error_in_file_transfer_work_function` are accepted connect kwargs.
new_driver_behavior: |
  The imported-package logging kwargs are silently ignored. The other
  kwargs are dropped with a `DeprecationWarning` and have no effect.
  `connection.session_id` after login still returns the server-assigned id.
