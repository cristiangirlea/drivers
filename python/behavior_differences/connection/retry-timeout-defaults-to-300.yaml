name: "HTTP attempts time out after 300 seconds by default"
status: unknown
type: enhancement
reviewed: false
is_breaking_change: true
impact: low
old_driver_behavior: |
  socket_timeout (default 60 s) is passed to requests as a scalar timeout, which is
  both connect and per-recv inactivity. A slow but active response never trips it.
  Result chunks use a separate 7-second DOWNLOAD_TIMEOUT.
new_driver_behavior: |
  retry_timeout defaults to 300 seconds when unset and bounds each HTTP
  attempt from start until the response body finishes. 0 removes the per-attempt
  limit. ConnectionConfig.retry_timeout and conn.socket_timeout still read back None
  when the caller does not set them. Result chunk downloads do not use this policy.
description: |
  The Python field stays None so generated ConnectionConfig is unchanged. The 300-second
  cap is applied in RetryPolicy::operation when the parameter is absent.
