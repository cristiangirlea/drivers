name: "password_callback connect parameter removed"
status: allowed
type: api_incompatibility
reviewed: true
is_breaking_change: true
impact: low
legacy_id: 100
old_driver_behavior: |
  `password_callback` is invoked when login returns `PWD_CHANGE`, and its
  return value is sent as `CHOSEN_NEW_PASSWORD`.
new_driver_behavior: |
  Passing `password_callback` raises `ProgrammingError`. An expired
  password must be changed outside the driver.
